<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Interior wall background">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece6da"/>
      <stop offset="1" stop-color="#c8bfad"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6e4d"/>
      <stop offset="1" stop-color="#54412d"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#wall)"/>
  <rect width="1600" height="700" fill="url(#spot)"/>

  <rect y="690" width="1600" height="14" fill="#3a2d1e"/>
  <rect y="700" width="1600" height="300" fill="url(#floor)"/>
</svg>
