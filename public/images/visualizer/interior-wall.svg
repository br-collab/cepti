<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Interior wall reference">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece6da"/>
      <stop offset="1" stop-color="#c8bfad"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6e4d"/>
      <stop offset="1" stop-color="#54412d"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce6ee"/>
      <stop offset="1" stop-color="#f6f4ee"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#wall)"/>
  <rect width="1600" height="700" fill="url(#spot)"/>

  <rect x="1180" y="180" width="300" height="340" fill="url(#window)" stroke="#9f917a" stroke-width="8"/>
  <line x1="1330" y1="180" x2="1330" y2="520" stroke="#9f917a" stroke-width="4"/>
  <line x1="1180" y1="350" x2="1480" y2="350" stroke="#9f917a" stroke-width="4"/>

  <rect y="690" width="1600" height="14" fill="#3a2d1e"/>
  <rect y="700" width="1600" height="300" fill="url(#floor)"/>

  <ellipse cx="250" cy="780" rx="180" ry="14" fill="#000" opacity="0.18"/>
  <rect x="150" y="560" width="200" height="210" rx="8" fill="#6b5234" stroke="#3a2d1e" stroke-width="4"/>
  <rect x="165" y="575" width="170" height="80" rx="4" fill="#826540"/>
  <rect x="165" y="665" width="170" height="90" rx="4" fill="#826540"/>
</svg>
